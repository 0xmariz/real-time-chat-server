<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Arena — Login / Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ================================================================
           CSS Reset & Variables
        ================================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deep:       #03060f;
            --bg-card:       rgba(10, 17, 35, 0.85);
            --bg-input:      rgba(255,255,255,0.04);
            --border-glass:  rgba(255,255,255,0.09);
            --accent-cyan:   #22d3ee;
            --accent-purple: #a855f7;
            --accent-gold:   #f59e0b;
            --accent-green:  #10b981;
            --accent-red:    #ef4444;
            --text-primary:  #f1f5f9;
            --text-secondary:#94a3b8;
            --text-muted:    #475569;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-deep);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ----------------------------------------------------------------
           Animated Background Grid + Orbs
        ---------------------------------------------------------------- */
        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(34, 211, 238, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: gridPulse 8s ease-in-out infinite;
        }
        @keyframes gridPulse {
            0%, 100% { opacity: 0.5; }
            50%       { opacity: 1;   }
        }

        .orb {
            position: fixed; border-radius: 50%;
            filter: blur(80px); pointer-events: none; z-index: 0;
            animation: orbFloat 12s ease-in-out infinite;
        }
        .orb-1 {
            width: 520px; height: 520px;
            background: radial-gradient(circle, rgba(168,85,247,0.18) 0%, transparent 70%);
            top: -140px; left: -120px;
        }
        .orb-2 {
            width: 420px; height: 420px;
            background: radial-gradient(circle, rgba(34,211,238,0.15) 0%, transparent 70%);
            bottom: -100px; right: -80px;
            animation-delay: -6s;
        }
        .orb-3 {
            width: 280px; height: 280px;
            background: radial-gradient(circle, rgba(245,158,11,0.10) 0%, transparent 70%);
            bottom: 30%; left: 30%;
            animation-delay: -3s;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%       { transform: translate(24px, -24px) scale(1.05); }
        }

        /* ----------------------------------------------------------------
           Login Card
        ---------------------------------------------------------------- */
        .login-card {
            position: relative; z-index: 10;
            width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 40px 40px 36px;
            backdrop-filter: blur(24px);
            box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
            animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(32px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logo */
        .logo-wrap {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 28px;
        }
        .logo-icon {
            width: 52px; height: 52px; border-radius: 14px;
            background: linear-gradient(135deg, #a855f7, #22d3ee);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 0 20px rgba(168,85,247,0.4);
        }
        .logo-text h1 {
            font-size: 1.4rem; font-weight: 800; letter-spacing: 0.08em;
            background: linear-gradient(90deg, #a855f7, #22d3ee);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .logo-text p {
            font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.12em; margin-top: 2px;
        }

        /* Tabs */
        .tab-bar {
            display: flex; gap: 4px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px; padding: 4px;
            margin-bottom: 28px;
        }
        .tab-btn {
            flex: 1; padding: 8px;
            border: none; background: transparent;
            color: var(--text-secondary); font-family: 'Outfit', sans-serif;
            font-size: 0.85rem; font-weight: 600; border-radius: 7px;
            cursor: pointer; transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(168,85,247,0.25), rgba(34,211,238,0.15));
            color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(34,211,238,0.1);
        }
        .tab-btn:hover:not(.active) { background: rgba(255,255,255,0.06); color: var(--text-primary); }

        /* Form */
        .form-panel { display: none; }
        .form-panel.active { display: block; animation: fadeIn 0.3s ease both; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block; font-size: 0.78rem; font-weight: 600;
            color: var(--text-secondary); margin-bottom: 7px; letter-spacing: 0.05em;
        }
        .input-field {
            width: 100%; padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-glass);
            border-radius: 10px; color: var(--text-primary);
            font-family: 'Outfit', sans-serif; font-size: 0.95rem;
            transition: all 0.2s ease; outline: none;
        }
        .input-field:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(34,211,238,0.12);
            background: rgba(34,211,238,0.04);
        }
        .input-field::placeholder { color: var(--text-muted); }

        /* Avatar Preview */
        .avatar-preview {
            display: flex; align-items: center; gap: 14px; margin-bottom: 20px;
            padding: 12px 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass); border-radius: 12px;
        }
        .avatar-preview img {
            width: 44px; height: 44px; border-radius: 50%;
            border: 2px solid var(--accent-cyan);
            transition: all 0.3s ease;
        }
        .avatar-preview-text {
            font-size: 0.8rem; color: var(--text-muted);
        }
        .avatar-preview-name {
            font-size: 0.95rem; font-weight: 700; color: var(--text-primary);
        }

        /* Submit button */
        .submit-btn {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #a855f7, #22d3ee);
            border: none; border-radius: 12px;
            color: #fff; font-family: 'Outfit', sans-serif;
            font-size: 1rem; font-weight: 700; letter-spacing: 0.04em;
            cursor: pointer; margin-top: 6px;
            transition: all 0.25s ease;
            position: relative; overflow: hidden;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(168,85,247,0.45); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Guest button */
        .guest-btn {
            width: 100%; padding: 11px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-glass); border-radius: 12px;
            color: var(--text-secondary); font-family: 'Outfit', sans-serif;
            font-size: 0.88rem; font-weight: 600;
            cursor: pointer; margin-top: 10px;
            transition: all 0.2s ease;
        }
        .guest-btn:hover {
            background: rgba(255,255,255,0.07);
            color: var(--text-primary); border-color: rgba(255,255,255,0.15);
        }

        /* Alert */
        .alert-box {
            padding: 12px 14px; border-radius: 10px;
            font-size: 0.82rem; font-weight: 600; margin-bottom: 16px;
            display: none; animation: fadeIn 0.2s ease both;
        }
        .alert-box.error { background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.25); }
        .alert-box.success { background: rgba(16,185,129,0.12); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.25); }

        /* Divider */
        .divider {
            display: flex; align-items: center; gap: 10px;
            margin: 16px 0 14px; color: var(--text-muted); font-size: 0.75rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: var(--border-glass);
        }

        /* Features strip */
        .features-strip {
            display: flex; gap: 12px; justify-content: center;
            margin-top: 24px; padding-top: 20px;
            border-top: 1px solid var(--border-glass);
        }
        .feature-badge {
            font-size: 0.68rem; font-weight: 600; letter-spacing: 0.05em;
            color: var(--text-muted); display: flex; align-items: center; gap: 4px;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
            border-radius: 50%; animation: spin 0.7s linear infinite;
            vertical-align: middle; margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .login-card { width: calc(100vw - 32px); padding: 28px 24px; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-card">
        <!-- Logo -->
        <div class="logo-wrap">
            <div class="logo-icon">⚡</div>
            <div class="logo-text">
                <h1>NEXUS ARENA</h1>
                <p>REAL-TIME GAMIFIED CHAT</p>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tabLogin" onclick="showTab('login')">🔐 Login</button>
            <button class="tab-btn" id="tabRegister" onclick="showTab('register')">🚀 Register</button>
        </div>

        <!-- Alert Box -->
        <div id="alertBox" class="alert-box"></div>

        <!-- LOGIN FORM -->
        <div id="panelLogin" class="form-panel active">
            <div class="avatar-preview">
                <img id="loginAvatarPreview" src="https://api.dicebear.com/7.x/bottts/svg?seed=Player" alt="Avatar">
                <div>
                    <div class="avatar-preview-name" id="loginPreviewName">Player</div>
                    <div class="avatar-preview-text">Your arena avatar</div>
                </div>
            </div>
            <div class="input-group">
                <label for="loginUsername">USERNAME</label>
                <input type="text" id="loginUsername" class="input-field" placeholder="e.g. CyberNinja" maxlength="32" autocomplete="username"
                       oninput="updateAvatarPreview('loginUsername','loginAvatarPreview','loginPreviewName')">
            </div>
            <div class="input-group">
                <label for="loginPassword">PASSWORD</label>
                <input type="password" id="loginPassword" class="input-field" placeholder="Enter your password" autocomplete="current-password"
                       onkeydown="if(event.key==='Enter') doLogin()">
            </div>
            <button class="submit-btn" id="loginBtn" onclick="doLogin()">
                🔐 Enter Arena
            </button>

            <div class="divider">or</div>

            <button class="guest-btn" onclick="showGuestPanel()">
                👥 Continue as Guest (no password)
            </button>
        </div>

        <!-- REGISTER FORM -->
        <div id="panelRegister" class="form-panel">
            <div class="avatar-preview">
                <img id="regAvatarPreview" src="https://api.dicebear.com/7.x/bottts/svg?seed=NewPlayer" alt="Avatar">
                <div>
                    <div class="avatar-preview-name" id="regPreviewName">NewPlayer</div>
                    <div class="avatar-preview-text">Your unique arena avatar</div>
                </div>
            </div>
            <div class="input-group">
                <label for="regUsername">CHOOSE USERNAME</label>
                <input type="text" id="regUsername" class="input-field" placeholder="Min. 3 chars, e.g. DragonSlayer" maxlength="32" autocomplete="username"
                       oninput="updateAvatarPreview('regUsername','regAvatarPreview','regPreviewName')">
            </div>
            <div class="input-group">
                <label for="regPassword">CREATE PASSWORD</label>
                <input type="password" id="regPassword" class="input-field" placeholder="Min. 4 characters" autocomplete="new-password">
            </div>
            <div class="input-group">
                <label for="regConfirm">CONFIRM PASSWORD</label>
                <input type="password" id="regConfirm" class="input-field" placeholder="Repeat your password" autocomplete="new-password"
                       onkeydown="if(event.key==='Enter') doRegister()">
            </div>
            <button class="submit-btn" id="registerBtn" onclick="doRegister()">
                🚀 Create Account
            </button>

            <div class="divider">or</div>

            <button class="guest-btn" onclick="showGuestPanel()">
                👥 Continue as Guest (no password)
            </button>
        </div>

        <!-- GUEST PANEL (shown via JS) -->
        <div id="panelGuest" class="form-panel">
            <div class="avatar-preview">
                <img id="guestAvatarPreview" src="https://api.dicebear.com/7.x/bottts/svg?seed=Guest" alt="Avatar">
                <div>
                    <div class="avatar-preview-name" id="guestPreviewName">Guest</div>
                    <div class="avatar-preview-text">Guest mode — XP &amp; progress saved</div>
                </div>
            </div>
            <div class="input-group">
                <label for="guestUsername">PICK A DISPLAY NAME</label>
                <input type="text" id="guestUsername" class="input-field" placeholder="e.g. ShadowWolf" maxlength="32" autocomplete="off"
                       oninput="updateAvatarPreview('guestUsername','guestAvatarPreview','guestPreviewName')"
                       onkeydown="if(event.key==='Enter') doGuest()">
            </div>
            <button class="submit-btn" id="guestBtn" onclick="doGuest()">
                👥 Join as Guest
            </button>
            <button class="guest-btn" onclick="showTab('login')" style="margin-top:8px">
                ← Back to Login
            </button>
        </div>

        <!-- Features Strip -->
        <div class="features-strip">
            <span class="feature-badge">⚡ TCP Port 8888</span>
            <span class="feature-badge">🏆 Leaderboard</span>
            <span class="feature-badge">📸 Stories</span>
            <span class="feature-badge">🎮 XP System</span>
        </div>
    </div>

    <script>
    // =========================================================
    // Tab Management
    // =========================================================
    function showTab(tab) {
        clearAlert();
        document.getElementById('panelLogin').classList.remove('active');
        document.getElementById('panelRegister').classList.remove('active');
        document.getElementById('panelGuest').classList.remove('active');
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('tabRegister').classList.remove('active');

        if (tab === 'login') {
            document.getElementById('panelLogin').classList.add('active');
            document.getElementById('tabLogin').classList.add('active');
        } else if (tab === 'register') {
            document.getElementById('panelRegister').classList.add('active');
            document.getElementById('tabRegister').classList.add('active');
        }
    }

    function showGuestPanel() {
        clearAlert();
        document.getElementById('panelLogin').classList.remove('active');
        document.getElementById('panelRegister').classList.remove('active');
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('tabRegister').classList.remove('active');
        document.getElementById('panelGuest').classList.add('active');
        // Seed a random guest name
        const rand = Math.floor(1000 + Math.random() * 9000);
        const defaultGuest = 'Player_' + rand;
        const el = document.getElementById('guestUsername');
        if (!el.value) {
            el.value = defaultGuest;
            updateAvatarPreview('guestUsername', 'guestAvatarPreview', 'guestPreviewName');
        }
    }

    // =========================================================
    // Live avatar preview
    // =========================================================
    function updateAvatarPreview(inputId, imgId, nameId) {
        const val = document.getElementById(inputId).value.trim() || 'Player';
        document.getElementById(imgId).src =
            'https://api.dicebear.com/7.x/bottts/svg?seed=' + encodeURIComponent(val);
        document.getElementById(nameId).textContent = val;
    }

    // =========================================================
    // Alert helpers
    // =========================================================
    function showAlert(msg, type) {
        const box = document.getElementById('alertBox');
        box.textContent = msg;
        box.className = 'alert-box ' + type;
        box.style.display = 'block';
    }
    function clearAlert() {
        const box = document.getElementById('alertBox');
        box.style.display = 'none';
    }

    function setLoading(btnId, loading, defaultText) {
        const btn = document.getElementById(btnId);
        if (loading) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Processing...';
        } else {
            btn.disabled = false;
            btn.innerHTML = defaultText;
        }
    }

    // =========================================================
    // Save session and redirect to chat
    // =========================================================
    function saveSession(userData) {
        localStorage.setItem('nexus_username', userData.username);
        localStorage.setItem('nexus_avatarUrl', userData.avatarUrl || '');
        localStorage.setItem('nexus_level', userData.level || 1);
        localStorage.setItem('nexus_score', userData.score || 0);
        localStorage.setItem('nexus_xp', userData.xp || 0);
        localStorage.setItem('nexus_guest', userData.guest === true ? 'true' : 'false');
        window.location.href = '/';
    }

    // =========================================================
    // Login
    // =========================================================
    function doLogin() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        clearAlert();

        if (!username || !password) {
            showAlert('Please enter both username and password.', 'error');
            return;
        }

        setLoading('loginBtn', true, '🔐 Enter Arena');

        fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        })
        .then(res => res.json())
        .then(data => {
            setLoading('loginBtn', false, '🔐 Enter Arena');
            if (data.success) {
                showAlert('✅ ' + data.message, 'success');
                setTimeout(() => saveSession(data), 600);
            } else {
                showAlert('❌ ' + data.message, 'error');
            }
        })
        .catch(err => {
            setLoading('loginBtn', false, '🔐 Enter Arena');
            showAlert('Connection error. Is the server running?', 'error');
        });
    }

    // =========================================================
    // Register
    // =========================================================
    function doRegister() {
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const confirm  = document.getElementById('regConfirm').value.trim();
        clearAlert();

        if (!username || !password || !confirm) {
            showAlert('Please fill in all fields.', 'error');
            return;
        }
        if (password !== confirm) {
            showAlert('Passwords do not match.', 'error');
            return;
        }

        setLoading('registerBtn', true, '🚀 Create Account');

        fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        })
        .then(res => res.json())
        .then(data => {
            setLoading('registerBtn', false, '🚀 Create Account');
            if (data.success) {
                showAlert('🎉 ' + data.message, 'success');
                setTimeout(() => saveSession(data), 700);
            } else {
                showAlert('❌ ' + data.message, 'error');
            }
        })
        .catch(err => {
            setLoading('registerBtn', false, '🚀 Create Account');
            showAlert('Connection error. Is the server running?', 'error');
        });
    }

    // =========================================================
    // Guest
    // =========================================================
    function doGuest() {
        const username = document.getElementById('guestUsername').value.trim();
        clearAlert();

        if (!username) {
            showAlert('Please pick a display name.', 'error');
            return;
        }

        setLoading('guestBtn', true, '👥 Join as Guest');

        fetch('/api/auth/guest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username })
        })
        .then(res => res.json())
        .then(data => {
            setLoading('guestBtn', false, '👥 Join as Guest');
            if (data.success) {
                showAlert('✅ ' + data.message, 'success');
                setTimeout(() => saveSession(data), 500);
            } else {
                showAlert('❌ ' + data.message, 'error');
            }
        })
        .catch(err => {
            setLoading('guestBtn', false, '👥 Join as Guest');
            showAlert('Connection error. Is the server running?', 'error');
        });
    }

    // =========================================================
    // On Load — if already logged in, go to chat
    // =========================================================
    window.addEventListener('DOMContentLoaded', () => {
        const existingUser = localStorage.getItem('nexus_username');
        if (existingUser) {
            // Already have a session — skip login
            window.location.href = '/';
            return;
        }

        // Pre-fill with a random guest name hint in the guest field
        const rand = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('guestUsername').value = 'Player_' + rand;
        updateAvatarPreview('guestUsername', 'guestAvatarPreview', 'guestPreviewName');
    });
    </script>
</body>
</html>
